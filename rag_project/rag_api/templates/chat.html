<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uniAI — Syllabus-Aware Exam Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            padding: 14px 20px;
            background: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.1rem;
            color: #e0e0e0;
            letter-spacing: 0.03em;
        }

        .header h1 span {
            color: #fff;
        }

        /* Session badge shown once subject is locked */
        #session-badge {
            display: none;
            align-items: center;
            gap: 8px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            color: #aaa;
        }

        #session-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #888;
        }

        #session-badge button {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 0;
            font-size: 0.85rem;
            line-height: 1;
        }

        #session-badge button:hover { color: #ccc; }

        /* ── Messages ── */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Each turn */
        .turn { display: flex; flex-direction: column; gap: 4px; }

        /* Meta line (mirrors CLI: [MODE]  Subject: X  Unit: Y  Expanded: '...') */
        .meta {
            font-size: 0.72rem;
            color: #666;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .meta .badge {
            background: #1a1a1a;
            color: #aaa;
            border-radius: 4px;
            padding: 1px 6px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .meta .expanded {
            font-style: italic;
            color: #555;
        }

        /* Message bubbles */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 82%;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .user {
            background: #e0e0e0;
            color: #111;
            align-self: flex-end;
        }

        .assistant {
            background: #161616;
            border: 1px solid #252525;
            color: #d4d4d4;
            align-self: flex-start;
        }

        /* Sources (mirrors CLI 📚 Sources: block) */
        .sources {
            margin-top: 8px;
            padding: 8px 12px;
            background: #111;
            border-left: 3px solid #333;
            border-radius: 0 6px 6px 0;
            font-size: 0.75rem;
            color: #555;
            align-self: flex-start;
            max-width: 82%;
        }

        .sources .src-title {
            color: #888;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .sources ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sources li::before { content: "• "; color: #555; }

        /* Thinking indicator */
        .thinking {
            background: #161616;
            border: 1px solid #252525;
            color: #555;
            padding: 10px 16px;
            border-radius: 10px;
            font-style: italic;
            font-size: 0.9rem;
            align-self: flex-start;
        }

        /* ── Markdown inside assistant bubbles ── */
        .assistant pre {
            background: #0e0e0e;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .assistant pre code { font-family: Consolas, Monaco, monospace; font-size: 0.88rem; }

        .assistant p code,
        .assistant li code {
            background: #1a1a1a;
            color: #ccc;
            padding: 1px 5px;
            border-radius: 4px;
            font-family: monospace;
        }

        .assistant ul, .assistant ol { padding-left: 20px; margin: 6px 0; }
        .assistant li { margin-bottom: 4px; }
        .assistant h3, .assistant h4 { color: #e0e0e0; margin: 10px 0 4px; }
        .assistant table { border-collapse: collapse; width: 100%; margin: 8px 0; }
        .assistant th, .assistant td {
            border: 1px solid #252525;
            padding: 6px 10px;
            text-align: left;
            font-size: 0.88rem;
        }
        .assistant th { background: #1a1a1a; color: #ccc; }

        /* KaTeX math rendering */
        .assistant .katex { font-size: 1.05em; color: #d4d4d4; }
        .assistant .katex-display { margin: 10px 0; padding: 8px 12px; background: #0e0e0e; border-radius: 6px; overflow-x: auto; }

        /* ── Input bar ── */
        .input-area {
            padding: 14px 20px;
            background: #111;
            border-top: 1px solid #222;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        #input {
            flex: 1;
            padding: 11px 14px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }

        #input:focus { border-color: #555; }
        #input::placeholder { color: #555; }

        #btn {
            padding: 11px 22px;
            background: #e0e0e0;
            color: #111;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.15s;
            white-space: nowrap;
        }

        #btn:hover { background: #ccc; }
        #btn:disabled { opacity: 0.35; cursor: not-allowed; }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎓 <span>uniAI</span> — Syllabus-Aware Exam Assistant</h1>
        <div id="session-badge">
            <div class="dot"></div>
            <span id="badge-label">Subject: —</span>
            <button id="clear-lock" title="Clear subject lock">✕</button>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Ask about your syllabus…"
            onkeypress="if(event.key==='Enter') send()">
        <button onclick="send()" id="btn">Send</button>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // ---------------------------------------------------------------------------
        // State  (mirrors chat_cli.py session variables)
        // ---------------------------------------------------------------------------
        const chatHistory = [];       // [{role, content}, ...]
        let sessionSubject = null;    // locked after first successful detection
        let isFirstQuery = true;

        // ---------------------------------------------------------------------------
        // Session badge
        // ---------------------------------------------------------------------------
        function setSessionSubject(subject) {
            sessionSubject = subject;
            const badge = document.getElementById('session-badge');
            badge.style.display = subject ? 'flex' : 'none';
            document.getElementById('badge-label').textContent = `Subject: ${subject}`;
        }

        document.getElementById('clear-lock').addEventListener('click', () => {
            setSessionSubject(null);
            isFirstQuery = true;
            appendInfo('Subject lock cleared. Will auto-detect on next query.');
        });

        // ---------------------------------------------------------------------------
        // DOM helpers
        // ---------------------------------------------------------------------------
        const $msgs = document.getElementById('messages');

        function scrollBottom() {
            $msgs.scrollTop = $msgs.scrollHeight;
        }

        /** Plain info line (light grey) */
        function appendInfo(text) {
            const el = document.createElement('div');
            el.style.cssText = 'font-size:0.78rem;color:#4a5568;text-align:center;';
            el.textContent = text;
            $msgs.appendChild(el);
            scrollBottom();
        }

        /** User bubble */
        function appendUser(text) {
            const turn = document.createElement('div');
            turn.className = 'turn';
            const msg = document.createElement('div');
            msg.className = 'message user';
            msg.textContent = text;
            turn.appendChild(msg);
            $msgs.appendChild(turn);
            scrollBottom();
            return turn;
        }

        /** Thinking placeholder */
        function appendThinking() {
            const el = document.createElement('div');
            el.className = 'thinking';
            el.id = 'thinking';
            el.textContent = '🤖 Thinking…';
            $msgs.appendChild(el);
            scrollBottom();
            return el;
        }

        /**
         * Assistant turn — mirrors _print_answer() in chat_cli.py
         *   [MODE]  Subject: X  Unit: Y  Expanded: '...'
         *   ────────────────
         *   <answer>
         *   📚 Sources: ...
         */
        function appendAssistant(data) {
            // Remove thinking placeholder
            const thinking = document.getElementById('thinking');
            if (thinking) thinking.remove();

            const turn = document.createElement('div');
            turn.className = 'turn';

            // ── Meta line ──
            const meta = document.createElement('div');
            meta.className = 'meta';

            const modeBadge = document.createElement('span');
            modeBadge.className = 'badge';
            modeBadge.textContent = (data.mode || 'syllabus').toUpperCase();
            meta.appendChild(modeBadge);

            if (data.subject) {
                const s = document.createElement('span');
                s.textContent = `Subject: ${data.subject}`;
                meta.appendChild(s);
            }
            if (data.unit) {
                const u = document.createElement('span');
                u.textContent = `Unit: ${data.unit}`;
                meta.appendChild(u);
            }
            if (data.expanded_query && data.expanded_query.toLowerCase() !== data.query?.toLowerCase()) {
                const e = document.createElement('span');
                e.className = 'expanded';
                e.textContent = `Expanded: '${data.expanded_query}'`;
                meta.appendChild(e);
            }
            turn.appendChild(meta);

            // ── Answer bubble ──
            const msg = document.createElement('div');
            msg.className = 'message assistant';
            msg.innerHTML = marked.parse(data.answer || '⚠ No response received.');
            // Render LaTeX math notation ($...$ and $$...$$)
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(msg, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true },
                    ],
                    throwOnError: false,
                });
            }
            turn.appendChild(msg);

            // ── Sources (mirrors 📚 Sources: block) ──
            const srcs = data.sources || [];
            if (srcs.length > 0) {
                const srcBox = document.createElement('div');
                srcBox.className = 'sources';
                const title = document.createElement('div');
                title.className = 'src-title';
                title.textContent = '📚 Sources:';
                srcBox.appendChild(title);
                const ul = document.createElement('ul');
                srcs.forEach(s => {
                    const li = document.createElement('li');
                    const score = s.score !== undefined ? ` | similarity=${s.score.toFixed(2)}` : '';
                    li.textContent = `${s.source} (p.${s.page}) | Unit ${s.unit}${score}`;
                    ul.appendChild(li);
                });
                srcBox.appendChild(ul);
                turn.appendChild(srcBox);
            }

            $msgs.appendChild(turn);
            scrollBottom();
        }

        // ---------------------------------------------------------------------------
        // Send
        // ---------------------------------------------------------------------------
        async function send() {
            const input = document.getElementById('input');
            const btn = document.getElementById('btn');
            const query = input.value.trim();
            if (!query) return;

            appendUser(query);
            chatHistory.push({ role: 'user', content: query });
            input.value = '';
            btn.disabled = true;
            btn.textContent = 'Thinking…';
            appendThinking();

            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        history: chatHistory,
                        subject: sessionSubject,   // send locked subject (mirrors session_subject in CLI)
                    }),
                });

                const data = await res.json();

                if (!res.ok) {
                    const thinking = document.getElementById('thinking');
                    if (thinking) thinking.remove();
                    appendInfo('⚠ Error: ' + (data.error || 'Server error.'));
                    return;
                }

                // Mirror CLI: lock subject after first successful detection
                if (isFirstQuery && data.subject && !sessionSubject) {
                    setSessionSubject(data.subject);
                    appendInfo(`[Session] Locked to subject: ${data.subject}`);
                }
                isFirstQuery = false;

                appendAssistant({ ...data, query });

                chatHistory.push({ role: 'assistant', content: data.answer });

            } catch (e) {
                const thinking = document.getElementById('thinking');
                if (thinking) thinking.remove();
                appendInfo('⚠ Network error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send';
            }
        }
    </script>
</body>

</html>
